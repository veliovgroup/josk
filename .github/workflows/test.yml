name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  # Driver majors for smoke jobs (update when bumping devDependencies)
  LATEST_MONGODB_DRIVER: '7'
  LATEST_REDIS_DRIVER: '5'
  # pg@7 breaks on Node 14+ (readyState === 'open' before connect); pg@8.20 declares Node >= 16
  LATEST_PG_DRIVER: '8'
  # Latest server images — literals in services.*.image and job name (env not allowed there)
  # redis:8-alpine  mongo:8  postgres:18-alpine  valkey/valkey:8.1.9-alpine  eqalpha/keydb:x86_64_v6.3.4

jobs:
  # Types, adapter guards, Jest core + coverage (once, all services)
  test-core:
    name: Core / Node 22
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: josk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Pin drivers (latest)
        run: |
          npm install --no-save \
            redis@${{ env.LATEST_REDIS_DRIVER }} \
            mongodb@${{ env.LATEST_MONGODB_DRIVER }} \
            pg@${{ env.LATEST_PG_DRIVER }}
          node -e "
            const pkgs = ['redis', 'mongodb', 'pg'];
            for (const name of pkgs) {
              console.log(name + ' driver:', require(name + '/package.json').version);
            }
          "

      - name: Type test
        run: npm run test:types

      - name: Adapter guards
        run: npm run test:adapter-guards

      - name: Jest unit + live adapter tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
          MONGO_URL: mongodb://127.0.0.1:27017/josk-jest-test
          PG_URL: postgres://postgres:postgres@127.0.0.1:5432/josk_test
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Node 20/22/24 × redis driver 4|5
  test-redis:
    name: Node ${{ matrix.node }} / redis@${{ matrix.redis-driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        node: ['20', '22', '24']
        redis-driver: ['4', '5']

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Pin redis@${{ matrix.redis-driver }}
        run: |
          npm install --no-save redis@${{ matrix.redis-driver }}
          node -e "console.log('redis driver:', require('redis/package.json').version)"

      - name: Mocha live tests (Redis)
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis

  # Redis Cluster (3 masters, useHashTags) × redis driver 4|5
  test-redis-cluster:
    name: Redis Cluster / redis@${{ matrix.redis-driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis-driver: ['4', '5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Pin redis@${{ matrix.redis-driver }}
        run: |
          npm install --no-save redis@${{ matrix.redis-driver }}
          node -e "console.log('redis driver:', require('redis/package.json').version)"

      - name: Start Redis Cluster
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          for port in 7001 7002 7003; do
            mkdir -p /tmp/redis-cluster/$port
            redis-server --port $port --cluster-enabled yes \
              --cluster-config-file /tmp/redis-cluster/$port/nodes.conf \
              --dir /tmp/redis-cluster/$port --save '' --appendonly no --daemonize yes
          done
          sleep 1
          redis-cli --cluster create 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 --cluster-replicas 0 --cluster-yes
          timeout 30 sh -c "until redis-cli -p 7001 cluster info | grep -q 'cluster_state:ok'; do sleep 1; done"

      - name: Jest live tests (Redis Cluster)
        env:
          REDIS_CLUSTER_URLS: redis://127.0.0.1:7001,redis://127.0.0.1:7002,redis://127.0.0.1:7003
        run: npm run test:jest:adapters -- -t Cluster

  # Node 20/22/24 × mongodb driver 5|6|7
  test-mongo:
    name: Node ${{ matrix.node }} / mongo@${{ matrix.mongodb-driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        node: ['20', '22', '24']
        mongodb-driver: ['5', '6', '7']

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Pin mongodb@${{ matrix.mongodb-driver }}
        run: |
          npm install --no-save mongodb@${{ matrix.mongodb-driver }}
          node -e "console.log('mongodb driver:', require('mongodb/package.json').version)"

      - name: Mocha live tests (MongoDB)
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/josk-mocha-test
        run: npm run test:mongo

  # Node floor: MongoDB adapter + Jest + guards on the lowest supported Node lines.
  # Dev tools are pinned per Node line (mocha 11 / jest 30 need Node 18+); see test/runtime-matrix/run.sh.
  test-node-floor:
    name: Node ${{ matrix.node }} / mongo@${{ matrix.mongodb-driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - { node: '14.21.3', mongodb-driver: '5.9.2', mocha: '10.8.2', chai: '4.5.0', jest: '29.7.0', redis: '4.7.1' }
          - { node: '16.20.2', mongodb-driver: '6.21.0', mocha: '10.8.2', chai: '4.5.0', jest: '29.7.0', redis: '4.7.1' }
          - { node: '18.19.1', mongodb-driver: '6.21.0', mocha: '11.7.5', chai: '6.2.2', jest: '30.4.2', redis: '4.7.1' }

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install Node-compatible dev tools
        run: |
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.devDependencies = {};
            delete p.scripts.prepublishOnly;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
          npm install --no-save --no-package-lock --ignore-scripts --engine-strict=false \
            mocha@${{ matrix.mocha }} chai@${{ matrix.chai }} jest@${{ matrix.jest }} \
            cron-parser@5.5.0 mongodb@${{ matrix.mongodb-driver }} \
            redis@${{ matrix.redis }} pg@8.20.0 josk5@npm:josk@5.0.0

      - name: Mocha live tests (MongoDB)
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/josk-floor-test
        run: node node_modules/mocha/bin/mocha.js ./test/npm-mongo.js ./test/mongo-url.test.js ./test/mongo-lock-index.js ./test/mongo-task-index.js

      - name: Adapter guards
        run: node node_modules/mocha/bin/mocha.js ./test/adapter-guards.js

      - name: Jest unit + live Mongo adapter tests
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/josk-floor-jest-test
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config jest.config.mjs --coverage=false

  # Node 20/22/24 × pg@8
  test-postgres:
    name: Node ${{ matrix.node }} / pg@8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        node: ['20', '22', '24']

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: josk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Pin pg@${{ env.LATEST_PG_DRIVER }}
        run: |
          npm install --no-save pg@${{ env.LATEST_PG_DRIVER }}
          node -e "console.log('pg driver:', require('pg/package.json').version)"

      - name: Mocha live tests (PostgreSQL)
        env:
          PG_URL: postgres://postgres:postgres@127.0.0.1:5432/josk_test
        run: npm run test:postgres

  # Redis server LTS+ lines (latest driver, Node 22)
  test-servers-redis:
    name: Servers redis:${{ matrix.redis-server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        redis-server: ['6', '7', '8']

    services:
      redis:
        image: redis:${{ matrix.redis-server }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Pin redis@${{ env.LATEST_REDIS_DRIVER }}
        run: |
          npm install --no-save redis@${{ env.LATEST_REDIS_DRIVER }}
          node -e "console.log('redis driver:', require('redis/package.json').version)"

      - name: Mocha live tests (Redis)
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis

  # Redis-compatible engines × redis@5 (Node 22), standalone only
  test-servers-redis-compatible:
    name: ${{ matrix.engine }} / Node 22 / redis@5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: Valkey 8.1.9
            image: valkey/valkey:8.1.9-alpine
          - engine: KeyDB 6.3.4
            image: eqalpha/keydb:x86_64_v6.3.4

    services:
      redis:
        image: ${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping || keydb-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Pin redis@${{ env.LATEST_REDIS_DRIVER }}
        run: |
          npm install --no-save redis@${{ env.LATEST_REDIS_DRIVER }}
          node -e "console.log('redis driver:', require('redis/package.json').version)"

      - name: Mocha live tests (Redis protocol)
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis

  # MongoDB server LTS+ lines (latest driver, Node 22)
  test-servers-mongo:
    name: Servers mongo:${{ matrix.mongo-server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        mongo-server: ['4.4', '5', '6', '7', '8']

    services:
      mongo:
        image: mongo:${{ matrix.mongo-server }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Pin mongodb@${{ env.LATEST_MONGODB_DRIVER }}
        run: |
          npm install --no-save mongodb@${{ env.LATEST_MONGODB_DRIVER }}
          node -e "console.log('mongodb driver:', require('mongodb/package.json').version)"

      - name: Mocha live tests (MongoDB)
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/josk-mocha-test
        run: npm run test:mongo

  # PostgreSQL server LTS+ lines (pg@8, Node 22)
  test-servers-postgres:
    name: Servers pg:${{ matrix.postgres-server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        postgres-server: ['14', '15', '16', '17', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres-server }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: josk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Pin pg@${{ env.LATEST_PG_DRIVER }}
        run: |
          npm install --no-save pg@${{ env.LATEST_PG_DRIVER }}
          node -e "console.log('pg driver:', require('pg/package.json').version)"

      - name: Mocha live tests (PostgreSQL)
        env:
          PG_URL: postgres://postgres:postgres@127.0.0.1:5432/josk_test
        run: npm run test:postgres

  # Bun latest — bun:test suite needs current runner (1.1 dir entry + 1.2 jest mock gaps); runtime still >=1.1.0
  test-bun:
    name: Bun latest / redis@${{ matrix.redis-driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        redis-driver: ['4', '5']

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: josk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Pin drivers (redis@${{ matrix.redis-driver }}, mongo@${{ env.LATEST_MONGODB_DRIVER }}, pg@${{ env.LATEST_PG_DRIVER }})
        run: |
          bun add --no-save \
            redis@${{ matrix.redis-driver }} \
            mongodb@${{ env.LATEST_MONGODB_DRIVER }} \
            pg@${{ env.LATEST_PG_DRIVER }}
          bun -e "
            const pkgs = ['redis', 'mongodb', 'pg'];
            for (const name of pkgs) {
              console.log(name + ' driver:', require(name + '/package.json').version);
            }
          "

      - name: Jest suite under bun:test
        env:
          REDIS_URL: redis://127.0.0.1:6379
          MONGO_URL: mongodb://127.0.0.1:27017/josk-bun-test
          PG_URL: postgres://postgres:postgres@127.0.0.1:5432/josk_test
        run: npm run test:bun

  # Bun (latest) × official driver majors on latest server images
  test-bun-drivers:
    name: Bun latest / mongo@${{ matrix.mongodb-driver }} redis@${{ matrix.redis-driver }} pg@8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        mongodb-driver: ['5', '6', '7']
        redis-driver: ['4', '5']

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: josk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Pin drivers
        run: |
          bun add --no-save \
            redis@${{ matrix.redis-driver }} \
            mongodb@${{ matrix.mongodb-driver }} \
            pg@${{ env.LATEST_PG_DRIVER }}
          bun -e "
            const pkgs = ['redis', 'mongodb', 'pg'];
            for (const name of pkgs) {
              console.log(name + ' driver:', require(name + '/package.json').version);
            }
          "

      - name: Jest adapter suite under bun:test
        env:
          REDIS_URL: redis://127.0.0.1:6379
          MONGO_URL: mongodb://127.0.0.1:27017/josk-bun-drivers-test
          PG_URL: postgres://postgres:postgres@127.0.0.1:5432/josk_test
        run: bun test ./test/jest/adapters.test.js

  # Meteor package tests — adapter suites plus TypeScript runtime tests in one Redis cell
  # Mongo adapter: no mongo service — Meteor test-packages starts its bundled mongod when MONGO_URL is unset
  test-meteor-mongo:
    name: Meteor ${{ matrix.meteor }} / mongo adapter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        meteor:
          - '2.14'
          - '2.15'
          - '2.16'
          - '3.2'
          - '3.3.1'
          - '3.4'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Meteor
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: meteor-${{ matrix.meteor }}-${{ runner.os }}

      - name: Install Meteor ${{ matrix.meteor }}
        run: |
          curl -fsSL "https://install.meteor.com?release=${{ matrix.meteor }}" | sh
          echo "$HOME/.meteor" >> $GITHUB_PATH

      - name: Meteor package tests (MongoDB)
        env:
          METEOR_TEST_SUITE: mongo
        run: |
          meteor test-packages ./ --driver-package=meteortesting:mocha --once

  test-meteor-redis:
    name: Meteor ${{ matrix.meteor }} / redis:${{ matrix.redis-server }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        meteor:
          - '2.14'
          - '2.15'
          - '2.16'
          - '3.2'
          - '3.3.1'
          - '3.4'
        redis-server: ['6', '7', '8']

    services:
      redis:
        image: redis:${{ matrix.redis-server }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Cache Meteor
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: meteor-${{ matrix.meteor }}-${{ runner.os }}

      - name: Install Meteor ${{ matrix.meteor }}
        run: |
          curl -fsSL "https://install.meteor.com?release=${{ matrix.meteor }}" | sh
          echo "$HOME/.meteor" >> $GITHUB_PATH

      - name: Meteor default package suite (3.4 / Redis 8)
        if: ${{ matrix.meteor == '3.4' && matrix.redis-server == '8' }}
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: meteor test-packages ./ --driver-package=meteortesting:mocha --once

      - name: Meteor package tests (Redis adapter)
        if: ${{ matrix.meteor != '3.4' || matrix.redis-server != '8' }}
        env:
          METEOR_TEST_SUITE: redis
          REDIS_URL: redis://127.0.0.1:6379
        run: meteor test-packages ./ --driver-package=meteortesting:mocha --once

  test-meteor-postgres:
    name: Meteor ${{ matrix.meteor }} / pg:${{ matrix.postgres-server }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        meteor:
          - '2.14'
          - '2.15'
          - '2.16'
          - '3.2'
          - '3.3.1'
          - '3.4'
        postgres-server: ['14', '15', '16', '17', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres-server }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: josk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Cache Meteor
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: meteor-${{ matrix.meteor }}-${{ runner.os }}

      - name: Install Meteor ${{ matrix.meteor }}
        run: |
          curl -fsSL "https://install.meteor.com?release=${{ matrix.meteor }}" | sh
          echo "$HOME/.meteor" >> $GITHUB_PATH

      - name: Meteor package tests (PostgreSQL)
        env:
          METEOR_TEST_SUITE: postgres
          PG_URL: postgres://postgres:postgres@127.0.0.1:5432/josk_test
        run: |
          meteor test-packages ./ --driver-package=meteortesting:mocha --once
